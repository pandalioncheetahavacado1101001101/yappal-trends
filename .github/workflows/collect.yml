name: collect

# WHAT THIS WORKFLOW DOES: one cycle of the collector about every 15 minutes, on a real quarter-hour cadence.
#
# GitHub's cron fires only about half of its slots (the real interval was about 30 minutes), so every run dispatches the run
# after it, and the cron stays as a watchdog. The expected behaviour, in order:
#
#   1. A run starts one of three ways: dispatched by the run before it (the chain: inputs.chain is true), by the cron below
#      (the watchdog) or by hand from the Actions page (inputs.chain false).
#   2. "gate" (seconds; no concurrency group): a WATCHDOG run that finds any other run of this workflow queued or in progress
#      ends at once with nothing done: the chain is alive. A chained or hand-started run always goes on. So the watchdog never
#      queues up behind a live chain, and a dispatched run waiting its turn is never cancelled by it (GitHub keeps at most
#      one waiting run per concurrency group and cancels the older waiting one when another arrives).
#   3. "cycle" (at most 14 minutes; concurrency group "collect", never cancelled in progress): the collector's cycle exactly as
#      before: restore the state, start the editor model, one cycle, publish the feed, save the state, delete the state's
#      superseded cache entries. A run that arrives while another holds the group WAITS for it. Last, its ledger line (below).
#   4. "next" (at most 16 minutes; after "cycle", and only when the cycle SUCCEEDED: a cycle that published, found nothing new
#      or found the lock held is a success; one that failed, exit 3 or more, or hit the 14-minute cap is not): computes the
#      next quarter-hour (:00, :15, :30, :45), sleeps until 60 seconds before it (14 minutes at most, wall time on this runner),
#      and dispatches the next run with "gh workflow run collect.yml" and the built-in GITHUB_TOKEN (GitHub lets that token
#      start a workflow_dispatch run; permissions "actions: write" below). Every dispatch lands a minute before a quarter-hour,
#      so a run is always queued, running or sleeping here, every watchdog run ends at its gate, and the cron and the chain
#      never both run a cycle. (Until 2026-10-19 "next" ran whatever came of the cycle and dispatched AT ONCE whenever the
#      quarter-hour was over four minutes off: a failed cycle never saves its state, so its successor restored the last good
#      state, sent the full network cycle again, failed again and dispatched again, ten or twelve times an hour, with no end
#      until somebody set IDEAS_CHAIN to "off". Now a failed cycle ends the chain, and the cron restarts it within a slot or
#      two, the old cadence.)
#      It dispatches NOTHING when: the cycle did not succeed (above); this run was not started by schedule or dispatch (never
#      from a push); the repository VARIABLE IDEAS_CHAIN is "off" (the hard stop: set it and the chain ends within one run,
#      the cron goes on as before; unset it and the next cron run that fires starts the chain again); or another run of this
#      workflow is already queued or in progress (that run carries the chain: never two chains). A run cancelled by hand runs
#      no "next" (its cycle did not succeed): the next cron run that fires starts the chain again, unless IDEAS_CHAIN is "off".
#   5. The cron stays as the watchdog. A fired slot that finds the chain alive costs one gate job of a few seconds and shows as
#      a green run of one job. A chain broken by anything (a failed cycle, a cancelled run, an API error, GitHub's own outage)
#      is restarted by the next cron run that does fire.
#
# THE LEDGER: every run that reaches its cycle appends ONE JSON line to ledger.jsonl at the root of the feed branch, beside
# v1/ (.github/scripts/ledger.sh, ledger.js): { slot, started, published, rows, requests, answered, modelCards, seconds, code, by,
# run, phases, cache }. Lines older than 7 days are dropped. A day's lead time (published minus slot), its real cadence and where
# each job's time went can then be read from the branch alone, with no server and no sign-in. Nothing in it is private: instants,
# counts and seconds only, never a name, a cache key or a per-trend number. The feed under v1/ is untouched by it.
#
# CHANGED 2026-10-19 (the cache, and the ledger's timings; nothing else in the cycle moved: no deadline, budget or order):
#   - THE STATE'S OLD CACHE ENTRIES ARE DELETED. Each cycle saved a new "state-<run>-<attempt>" entry and none was ever deleted:
#     79 of them (5.5 GB) beside the editor model (5.2 GB) took the repository's Actions cache over its 10 GB cap, where GitHub
#     evicts the least recently used and the model or the state could go at any time. Now, after a state save that succeeded,
#     "Delete the superseded state caches" (.github/scripts/cache-prune.js) keeps the newest 3 state entries of this branch and
#     deletes every older one by its exact key, scoped to this branch. It never touches "editor-model-*" or any key that is not
#     exactly state-<digits>-<digits>, deletes nothing unless this run's own save is listed, deletes at most 40 a run (the first
#     two runs clear the 76 or so; then one a run), stops at 13 min 20 s on the job's clock, and never fails the job.
#   - THE LEDGER TIMES EACH PHASE. Steps leave marks on the job's clock (MARK_*: epoch milliseconds, in $GITHUB_ENV; the job's
#     clock leaves the first, one new step, "The clock, before the state's restore", ends the set-up, and the existing steps mark
#     where they start or end), and each ledger line's `phases` gives the seconds of:
#     setup, stateRestore, feedRead, modelRestore, modelStart, cycle (collect.js as a process) and, from the collector's own
#     summary, its fetch, build, measure, lines, editor, feed and publish; then push, stateSave and cachePrune. `cache` gives the
#     cache's GB and entries after the prune and whether the editor model is in it. `answered`: the requests that got an answer.
#
# EXPECTED, once it runs: the cycle job starts within a minute of each quarter-hour; its publish lands 8 to 13 minutes after
# its slot; the cycle job never runs twice at once; the Actions list shows a chained run per quarter-hour and, between them,
# the watchdog's short runs.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      cold_start:
        description: 'Start from nothing on purpose: do not read the history back from the feed already out'
        type: boolean
        default: false
      chain:
        description: 'Set by the run before this one (the chain). Leave it off when starting a run by hand'
        type: boolean
        default: false

# contents: the feed branch. actions: "gh workflow run" (the chain) and "gh run list" (the gate).
permissions:
  contents: write
  actions: write

env:
  # how this run was started: the ledger records it, and the gate and the chain decide by it
  STARTED_BY: ${{ (github.event_name == 'schedule' && 'schedule') || (inputs.chain && 'chain') || 'hand' }}

jobs:
  # Seconds, outside the concurrency group: is this run needed? (.github/scripts/chain.sh gate)
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.look.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this run needed
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/chain.sh gate

  cycle:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Never two cycles at once; a run that arrives while another holds the group waits its turn instead of being dropped.
    concurrency:
      group: collect
      cancel-in-progress: false
    # Not raised for the model: the next run is dispatched after this job ends (the "next" job below), so a longer job would push
    # the chain off its quarter-hour. The editor is given what is left of this job instead (EDITOR_UNTIL below), and what it has
    # not written waits a cycle.
    timeout-minutes: 14
    env:
      # THE EDITOR MODEL: a small open model served on this runner itself (no key, no account; .github/scripts/model.sh).
      # It writes each card from the story's own dossier and every card is held to the claim check before it is shown.
      # Gemma 4 E4B by default. Measured on this kind of runner (4 cores) on a 100-token question: Qwen3.5-4B 6.3 s (and it
      # worded an accusation nobody made), Gemma 9.7 s and Qwen3.5-9B 11.7 s (both right). A card is a longer question and a
      # longer answer than that: twenty cards of the 9B do not fit what a 14-minute job has left, so the default is the faster
      # of the two that were right, and the editor's own time budget, not a count, decides how many cards a cycle writes
      # (the rest wait a cycle; a card is written once per change of its story). The VARIABLE IDEAS_EDITOR_MODEL names another
      # (hf.co/unsloth/Qwen3.5-9B-GGUF:Q4_K_M); IDEAS_EDITOR_OFF=1 runs every cycle with no model at all.
      EDITOR_MODEL: ${{ vars.IDEAS_EDITOR_MODEL || 'hf.co/unsloth/gemma-4-E4B-it-GGUF:Q4_K_M' }}
      EDITOR_OFF: ${{ vars.IDEAS_EDITOR_OFF }}
      # An OpenAI-compatible endpoint of the owner's choosing may be named instead in the VARIABLES IDEAS_LLM_BASE_URL and
      # IDEAS_LLM_MODEL: then no model is started here. None is set by default.
      OWN_ENDPOINT: ${{ vars.IDEAS_LLM_BASE_URL }}
      OWN_MODEL: ${{ vars.IDEAS_LLM_MODEL }}
      # The editor's budget: twenty first asks and five minutes a cycle at most, a minute and a half for one card, and never
      # past the job's own clock (IDEAS_EDITOR_UNTIL, set when the job starts).
      IDEAS_EDITOR_CARDS: 20
      IDEAS_EDITOR_BUDGET_MS: 300000
      IDEAS_EDITOR_TIMEOUT_MS: 90000
      IDEAS_EDITOR_MAX_TOKENS: 320
      FEED_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      FRESH: ${{ inputs.cold_start && '--fresh' || '' }}
    steps:
      # The job's clock: the model must be answering four and a half minutes in or the cycle runs without it; the editor stops
      # asking a little over eleven minutes in; the rest is the feed's (publish, the state's health, the state's cache).
      - name: The job's clock
        run: |
          now=$(date +%s)
          echo "STARTED=$now" >> "$GITHUB_ENV"
          # (the marks: epoch milliseconds where each phase ends, for the ledger line's `phases`; times only, never a reason to stop)
          echo "MARK_BEGIN=$(date +%s%3N)" >> "$GITHUB_ENV"
          echo "MODEL_BY=$((now + 270))" >> "$GITHUB_ENV"
          echo "IDEAS_EDITOR_UNTIL=$((now + 680))" >> "$GITHUB_ENV"
          # (the cycle's own deadline, thirteen minutes in: tied to the job's clock, not to when the cycle starts, so a slow model
          # restore or a slow model start can never push the cycle past the job's cap before the feed is published and the state saved)
          echo "CYCLE_UNTIL=$((now + 780))" >> "$GITHUB_ENV"
          echo "MODEL_KEY=$(printf '%s' "$EDITOR_MODEL" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # (a mark on the job's clock: the set-up ends here and the state's restore begins)
      - name: The clock, before the state's restore
        run: echo "MARK_SETUP=$(date +%s%3N)" >> "$GITHUB_ENV"

      # The history lives only in the Actions cache: it is never committed or published. The cache is not storage (GitHub evicts
      # it at will), so a run that finds none does not start cold: the collector reads its history back from the feed that is
      # already out, which is public anyway (every listed id, start, status and graph), and marks what it read back as such.
      - name: Restore state from the last cycle
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Fetch the feed already out
        run: |
          echo "MARK_STATE=$(date +%s%3N)" >> "$GITHUB_ENV"
          bash .github/scripts/restore.sh
          echo "MARK_FEED=$(date +%s%3N)" >> "$GITHUB_ENV"

      # The model file (several GB) is kept in the Actions cache under the model's own name and is restored in about a minute.
      # A job that finds none runs its cycle with no model, fetches the file behind it and saves it at the end: one cycle
      # later the model is there. Nothing here can fail the job: a step that does not finish in time or does not work leaves
      # the cycle to run with no model.
      - name: Restore the editor model
        id: modelcache
        if: env.EDITOR_OFF != '1' && env.OWN_ENDPOINT == ''
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: editor-model-v1-${{ env.MODEL_KEY }}

      - name: Start the editor model
        id: model
        if: env.EDITOR_OFF != '1' && env.OWN_ENDPOINT == ''
        continue-on-error: true
        timeout-minutes: 6
        run: |
          echo "MARK_MODEL=$(date +%s%3N)" >> "$GITHUB_ENV"
          bash .github/scripts/model.sh "$EDITOR_MODEL" "$MODEL_BY"

      - name: An endpoint of the owner's own, when one is named
        if: env.OWN_ENDPOINT != ''
        run: |
          echo "IDEAS_LLM_BASE_URL=$OWN_ENDPOINT" >> "$GITHUB_ENV"
          echo "IDEAS_LLM_MODEL=$OWN_MODEL" >> "$GITHUB_ENV"
          echo "IDEAS_EDITOR=1" >> "$GITHUB_ENV"

      - name: One cycle
        id: cycle
        run: |
          set +e
          echo "MARK_CYCLE=$(date +%s%3N)" >> "$GITHUB_ENV"
          # (what is left of the cycle's deadline on the job's clock, two minutes at the least: a cycle is never started with no time)
          left=$(( CYCLE_UNTIL - $(date +%s) ))
          [ "$left" -ge 120 ] || left=120
          echo "cycle deadline: $left s"
          node collect.js --state state --out out --deadline-seconds=$left $FRESH > cycle.json 2> cycle.log
          code=$?
          echo "MARK_CYCLE_END=$(date +%s%3N)" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat cycle.json
          grep -E '^\[(reseed|collect|time)\]' cycle.log || true
          # (what the editor did this cycle: counts only. A refused card's wording stays in the job's own log and is never published)
          grep -cE '^\[editor\]' cycle.log | sed 's/^/editor log lines: /' || true
          # 0: a feed was published; 1: nothing new (the feed already out stands); 2: another cycle holds the lock;
          # 3 or more: the cycle failed (the engine, an error nobody foresaw, a clock that cannot be trusted)
          # (never the editor's or the writer's own lines: a card the gate refused is unchecked wording, and this log is public)
          if [ "$code" -ne 0 ]; then echo "--- cycle.log (exit $code) ---"; grep -vE '^\[(editor|lines)\]' cycle.log | tail -n 40; fi
          if [ "$code" -ge 3 ]; then exit "$code"; fi

      - name: Publish the feed
        id: publish
        if: steps.cycle.outputs.code == '0'
        run: bash .github/scripts/publish-feed.sh

      # Never an empty or a failed state over a good one: the folder is saved as the newest only after a cycle that did not fail,
      # and only when the collector itself says it holds a state worth keeping (it opens, passes its integrity check, has finished
      # a cycle and knows a trend). Anything else leaves the last good cache the newest.
      - name: Is the state worth saving
        id: health
        if: always()
        run: |
          echo "MARK_PUSHED=$(date +%s%3N)" >> "$GITHUB_ENV"
          bash .github/scripts/state-health.sh "${{ steps.cycle.outputs.code }}"

      - name: Save state for the next cycle
        id: save
        if: always() && steps.health.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # The state's superseded cache entries (the header's CHANGED 2026-10-19; .github/scripts/cache-prune.js): only after a save
      # that succeeded, and never in a run that was cancelled or hit its cap. Keeps the newest 3 state entries of this branch, this
      # run's own among them, and deletes every older one by its exact key; never "editor-model-*". Before the ledger line, which
      # carries its counts. Its deadline is 13 min 20 s on the job's clock or 100 s from now, whichever is sooner, so the job never
      # meets its cap here; never a reason for the job to fail.
      - name: Delete the superseded state caches
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRUNE_SAVED_KEY: state-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "MARK_SAVED=$(date +%s%3N)" >> "$GITHUB_ENV"
          deadline=$(( STARTED + 800 )); soonest=$(( $(date +%s) + 100 ))
          [ "$deadline" -le "$soonest" ] || deadline=$soonest
          PRUNE_UNTIL=$deadline node .github/scripts/cache-prune.js

      # The run's one line on the feed branch (the ledger at the top of this file): inside the concurrency group, so it never
      # races the next run's publish. Never a reason for the job to fail.
      - name: The ledger line
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          # (the job's own start, from its clock above: the line's `started`, `slot` and `seconds` are all measured from it)
          LEDGER_STARTED: ${{ env.STARTED }}
          LEDGER_PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          LEDGER_CODE: ${{ steps.cycle.outputs.code }}
        run: bash .github/scripts/ledger.sh

      # Once: the job that found no model in the cache fetched it behind its cycle (which ran with none) and keeps it here for
      # every later one. After the state, so a slow upload costs no cycle; never a reason for the job to fail.
      - name: Has the editor model arrived
        id: fetched
        if: always() && steps.model.outputs.pulled == 'started'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          for _ in $(seq 1 100); do
            if ollama list 2>/dev/null | awk 'NR>1 {print $1}' | grep -qxF "$EDITOR_MODEL"; then echo "whole=true" >> "$GITHUB_OUTPUT"; echo "the model is whole"; exit 0; fi
            pgrep -f "ollama pull" >/dev/null || break
            sleep 2
          done
          tail -n 2 /tmp/ollama-pull.log || true
          echo "the model is not whole yet: the next job fetches it again"

      - name: Keep the editor model for the next cycles
        if: always() && steps.fetched.outputs.whole == 'true'
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: editor-model-v1-${{ env.MODEL_KEY }}

  # The chain (.github/scripts/chain.sh next): after the cycle, and told how it went (CYCLE_RESULT: a cycle that failed or hit its
  # cap dispatches nothing, and the cron restarts the chain). Outside the concurrency group, so the run it dispatches can start
  # its own cycle the moment this one's is over. The sleep is wall time on this runner: until a minute before the next
  # quarter-hour, 14 minutes at most, inside the 16 the job is given.
  next:
    needs: [gate, cycle]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch the next run at the next quarter-hour
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHAIN_REF: ${{ github.ref_name }}
          IDEAS_CHAIN: ${{ vars.IDEAS_CHAIN }}
          CYCLE_RESULT: ${{ needs.cycle.result }}
        run: bash .github/scripts/chain.sh next
