name: collect

# One cycle of the collector every 15 minutes (off the hour, when GitHub's schedule is least delayed).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never two cycles at once; a late one waits its turn instead of being dropped.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      # The line writer. With no variables set it uses the keyless endpoint (about one line a cycle).
      # A key is never written in this repository: it goes in the SECRET IDEAS_LLM_API_KEY, with the VARIABLES
      # IDEAS_LLM_BASE_URL and IDEAS_LLM_MODEL.
      IDEAS_LLM_BASE_URL: ${{ vars.IDEAS_LLM_BASE_URL || 'https://text.pollinations.ai/openai' }}
      IDEAS_LLM_MODEL: ${{ vars.IDEAS_LLM_MODEL }}
      IDEAS_LLM_API_KEY: ${{ secrets.IDEAS_LLM_API_KEY }}
      FEED_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # The history lives only in the Actions cache: it is never committed or published.
      - name: Restore state from the last cycle
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Fetch the feed already out
        run: bash .github/scripts/restore.sh

      - name: One cycle
        id: cycle
        run: |
          set +e
          node collect.js --state state --out out --deadline-seconds=600 > cycle.json 2> cycle.log
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat cycle.json
          # 0: a feed was published; 1: nothing new (the feed already out stands); 2: another cycle holds the lock
          if [ "$code" -gt 2 ]; then tail -n 20 cycle.log; exit "$code"; fi

      - name: Publish the feed
        if: steps.cycle.outputs.code == '0'
        run: bash .github/scripts/publish-feed.sh

      - name: Save state for the next cycle
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
