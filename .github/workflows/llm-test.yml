name: llm-test

# An experiment, not part of the schedule: can a small open model running on the runner itself (no key, no account) write the
# one-line summaries? Each model writes lines for one real cycle through the collector's own claim check; the results (titles and
# lines only, as a feed carries them) go out as the single commit of the "llm-test" branch.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/llm/**'
      - '.github/workflows/llm-test.yml'

permissions:
  contents: write

concurrency:
  group: llm-test
  cancel-in-progress: true

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESULT_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      MODELS: "hf.co/unsloth/Qwen3.5-4B-GGUF:Q4_K_M hf.co/unsloth/gemma-4-E4B-it-GGUF:Q4_K_M hf.co/unsloth/Qwen3.5-9B-GGUF:Q4_K_M"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Models from the last run
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-v1

      - name: Install the model runner and fetch the models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          nproc; free -g | head -2
          for m in $MODELS; do ollama pull "$m" || echo "could not fetch $m"; done
          ollama list

      - name: A cycle with no model (the baseline, and the state every model starts from)
        run: |
          node collect.js --state st-base --out out-base --max-requests=70 --deadline-seconds=400 > base.json 2> base.log || true
          tail -c 600 base.json

      - name: Which switch stops a model thinking aloud
        run: |
          rm -f diag.md
          for m in $MODELS; do node .github/llm/diag.js "$m" || true; ollama stop "$m" || true; done
          cat diag.md

      - name: One cycle per model
        run: |
          rm -f results.json results.md
          i=0
          for m in $MODELS; do
            i=$((i+1))
            # each model gets its own fresh state and a whole cycle of its own (the same slot, another folder)
            start=$(date +%s)
            IDEAS_LLM_BASE_URL=http://127.0.0.1:11434/v1 IDEAS_LLM_MODEL="$m" IDEAS_LLM_PER_CYCLE=14 IDEAS_LLM_RPM=120 \
            IDEAS_LLM_TIMEOUT_MS=150000 IDEAS_LLM_BUDGET_MS=540000 IDEAS_LLM_DAILY=500 IDEAS_LLM_MAX_TOKENS=900 IDEAS_LLM_REASONING=none \
              node collect.js --state "st-$i" --out "out-$i" --max-requests=70 --deadline-seconds=780 > "cycle-$i.json" 2> "cycle-$i.log"
            code=$?
            end=$(date +%s)
            echo "exit $code after $((end-start))s"; tail -c 400 "cycle-$i.json"
            node .github/llm/report.js "$m" out-base "out-$i" "cycle-$i.json" "$((end-start))" "cycle-$i.log" "$code"
            ollama stop "$m" || true
          done
          cat results.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish the results as the single commit of the llm-test branch
        run: |
          set -euo pipefail
          [ -f results.md ] || { echo "# Local model line-writing test" > results.md; echo "No model produced a result; see the job log." >> results.md; echo "[]" > results.json; }
          tmp="$(mktemp -d)"; cp results.md results.json "$tmp/"; [ -f diag.md ] && cp diag.md "$tmp/"; cd "$tmp"
          git init -q -b llm-test && git add -A
          git -c user.name="ideas-collector" -c user.email="ideas-collector@users.noreply.github.com" commit -q -m "llm test $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "$RESULT_REMOTE" llm-test
